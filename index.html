<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Buzzer</title>
   <!-- Bulletproof Cloudflare and Unpkg Fallback Links -->
    <script src="cloudflare.com" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="jsdelivr.net"></script>
    <script src="tailwindcss.com"></script>
    <style>
        @import url('googleapis.com');
        body { font-family: 'Inter', sans-serif; background-color: #0b0b0b; color: #f5f5f5; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4 select-none">

    <script>
        // CONFIGURATION
        const SUPABASE_URL = "https://wfpqmyfhbwqszdzfjvbl.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndmcHFteWZoYndxc3pkemZqdmJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3MjgwNjEsImV4cCI6MjA5NDMwNDA2MX0.bm1xlejZwhtvGL-CzdozL9yaw3iksaTbe8l1re2vrCg"; // Ensure no spaces exist here

        // Secure Initialization Catch
        let supabase;
        try {
            supabase = window.Supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch(e) {
            alert("Database Connection Library Failed: " + e.message);
        }

        let currentRoom = "";
        let currentUsername = "";
        let isAdmin = false;
        let buzzerEnabled = true;
        let supabaseSubscription = null;
    </script>

    <!-- 1. LANDING SCREEN -->
    <div id="landing-screen" class="w-full max-w-md p-6 bg-[#161616] rounded-2xl border border-[#262626] shadow-2xl">
        <h1 class="text-3xl font-extrabold tracking-tight text-center mb-8 text-white">QUIZ<span class="text-red-500">BUZZER</span></h1>
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Room Code</label>
                <input type="text" id="room-input" placeholder="e.g. GAME123" class="w-full bg-[#222] border border-[#333] rounded-lg px-4 py-3 text-white focus:outline-none focus:border-red-500 font-mono tracking-widest uppercase">
            </div>
            <div id="username-container">
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Your Name</label>
                <input type="text" id="username-input" placeholder="e.g. Alex" class="w-full bg-[#222] border border-[#333] rounded-lg px-4 py-3 text-white focus:outline-none focus:border-red-500">
            </div>
            <button onclick="joinGame(false)" class="w-full bg-white text-black font-bold py-3.5 rounded-lg active:scale-95 transition-transform cursor-pointer mt-4">Join as Player</button>
            <button onclick="joinGame(true)" class="w-full bg-[#222] border border-[#333] text-gray-300 font-semibold py-3 rounded-lg active:scale-95 transition-transform cursor-pointer">Host as Admin</button>
        </div>
    </div>

    <!-- 2. PLAYER SCREEN -->
    <div id="player-screen" class="hidden w-full max-w-md text-center">
        <div class="mb-8 bg-[#161616] border border-[#262626] py-2 px-4 rounded-full inline-flex gap-4 text-sm font-mono">
            <span class="text-gray-400">ROOM: <strong class="text-white" id="player-room-display">-</strong></span>
            <span class="text-gray-400">USER: <strong class="text-white" id="player-name-display">-</strong></span>
        </div>
        <div class="flex flex-col items-center justify-center h-[50vh]">
            <button id="buzzer-btn" onclick="triggerBuzz()" class="w-64 h-64 rounded-full bg-red-600 border-b-[12px] border-red-800 text-white font-extrabold text-2xl tracking-wide uppercase transition-all duration-150 shadow-[0_15px_0_0_#991b1b,0_20px_30px_0_rgba(0,0,0,0.5)] active:translate-y-2 active:border-b-[4px] active:shadow-[0_4px_0_0_#991b1b,0_10px_15px_0_rgba(0,0,0,0.3)] cursor-pointer flex items-center justify-center p-4 text-center">
                Press to Buzz
            </button>
        </div>
    </div>

    <!-- 3. ADMIN SCREEN -->
    <div id="admin-screen" class="hidden w-full max-w-xl p-6 bg-[#161616] rounded-2xl border border-[#262626] shadow-2xl">
        <div class="flex justify-between items-center mb-6 pb-4 border-b border-[#262626]">
            <div>
                <h2 class="text-xl font-bold">Admin Dashboard</h2>
                <p class="text-xs text-gray-400 font-mono">Room Code: <span id="admin-room-display" class="text-red-500 font-bold uppercase"></span></p>
            </div>
            <button onclick="resetBuzzer()" class="bg-red-600 hover:bg-red-700 text-white font-bold px-6 py-2.5 rounded-lg active:scale-95 transition-transform cursor-pointer text-sm tracking-wide uppercase">Reset Board</button>
        </div>
        <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Buzzer Order</h3>
        <div id="leaderboard" class="space-y-2 max-h-[60vh] overflow-y-auto pr-1">
            <p id="empty-state" class="text-sm text-gray-500 italic text-center py-8">Waiting for players to buzz...</p>
        </div>
    </div>

    <script>
        async function joinGame(asAdmin) {
            try {
                const roomInput = document.getElementById('room-input').value.trim().toUpperCase();
                const usernameInput = document.getElementById('username-input').value.trim();

                if (!roomInput) return alert("Please enter a Room Code");
                if (!asAdmin && !usernameInput) return alert("Please enter a Username");

                currentRoom = roomInput;
                currentUsername = asAdmin ? "Admin" : usernameInput;
                isAdmin = asAdmin;

                if (isAdmin) {
                    await supabase.from('rooms').upsert({ id: currentRoom });
                    document.getElementById('admin-room-display').innerText = currentRoom;
                    switchScreen('landing-screen', 'admin-screen');
                    listenToRoomUpdates();
                    fetchCurrentBuzzes();
                } else {
                    document.getElementById('player-room-display').innerText = currentRoom;
                    document.getElementById('player-name-display').innerText = currentUsername;
                    switchScreen('landing-screen', 'player-screen');
                    listenToRoomUpdates();
                }
            } catch(err) {
                alert("Navigation Error: " + err.message);
            }
        }

        function switchScreen(from, to) {
            document.getElementById(from).classList.add('hidden');
            document.getElementById(to).classList.remove('hidden');
        }

        function listenToRoomUpdates() {
            supabaseSubscription = supabase.channel(`room:${currentRoom}`)
                .on('postgres_changes', { event: '*', schema: 'public', table: 'buzzes', filter: `room_id=eq.${currentRoom}` }, (payload) => {
                    if (isAdmin) {
                        fetchCurrentBuzzes();
                    } else {
                        handlePlayerSync(payload);
                    }
                })
                .subscribe();
        }

        async function triggerBuzz() {
            if (!buzzerEnabled) return;
            buzzerEnabled = false;

            if (navigator.vibrate) navigator.vibrate(100);

            const { error } = await supabase.from('buzzes').insert({
                room_id: currentRoom,
                username: currentUsername
            });
            
            if(error) {
                buzzerEnabled = true;
                alert("Database insertion rejected: " + error.message);
            }
        }

        function handlePlayerSync(payload) {
            const btn = document.getElementById('buzzer-btn');
            if (payload.eventType === 'INSERT') {
                buzzerEnabled = false;
                const localWinner = payload.new.username;
                btn.className = "w-64 h-64 rounded-full bg-emerald-600 border-b-[12px] border-emerald-800 text-white font-extrabold text-2xl tracking-wide uppercase transition-all duration-150 shadow-[0_15px_0_0_#065f46,0_20px_30px_0_rgba(0,0,0,0.5)] flex items-center justify-center p-4 text-center";
                btn.innerText = `${localWinner} Buzzed!`;
            } 
            else if (payload.eventType === 'DELETE' || payload.eventType === 'UPDATE') {
                buzzerEnabled = true;
                btn.className = "w-64 h-64 rounded-full bg-red-600 border-b-[12px] border-red-800 text-white font-extrabold text-2xl tracking-wide uppercase transition-all duration-150 shadow-[0_15px_0_0_#991b1b,0_20px_30px_0_rgba(0,0,0,0.5)] active:translate-y-2 active:border-b-[4px] active:shadow-[0_4px_0_0_#991b1b,0_10px_15px_0_rgba(0,0,0,0.3)] cursor-pointer flex items-center justify-center p-4 text-center";
                btn.innerText = "Press to Buzz";
            }
        }

        async function fetchCurrentBuzzes() {
            const { data, error } = await supabase
                .from('buzzes')
                .select('username, buzzed_at')
                .eq('room_id', currentRoom)
                .order('buzzed_at', { ascending: true });

            if (error) return;

            const leaderboard = document.getElementById('leaderboard');
            if (data.length === 0) {
                leaderboard.innerHTML = '<p id="empty-state" class="text-sm text-gray-500 italic text-center py-8">Waiting for players to buzz...</p>';
                return;
            }

            leaderboard.innerHTML = "";
            data.forEach((entry, index) => {
                const row = document.createElement('div');
                const isFirst = index === 0;
                
                row.className = `flex justify-between items-center p-4 rounded-xl border transition-all ${
                    isFirst 
                    ? 'bg-emerald-950/40 border-emerald-500 text-emerald-400 font-bold shadow-[0_0_15px_rgba(16,185,129,0.1)]' 
                    : 'bg-[#1e1e1e] border-[#2d2d2d] text-gray-300'
                }`;

                row.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="font-mono text-xs ${isFirst ? 'text-emerald-400' : 'text-gray-500'}">#${index + 1}</span>
                        <span class="text-base tracking-wide">${entry.username}</span>
                    </div>
                    <div>
                        ${isFirst ? '<span class="bg-emerald-500 text-black text-[10px] font-extrabold px-2 py-0.5 rounded mr-2 tracking-widest">FASTEST</span>' : ''}
                        <span class="font-mono text-xs text-gray-500">${new Date(entry.buzzed_at).toLocaleTimeString()}</span>
                    </div>
                `;
                leaderboard.appendChild(row);
            });
        }

        async function resetBuzzer() {
            await supabase.from('buzzes').delete().eq('room_id', currentRoom);
            fetchCurrentBuzzes();
        }
    </script>
</body>
</html>
