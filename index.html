<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiz Buzzer</title>
    
    <!-- This is the core external database library script. It MUST download completely before any code executes. -->
    <script src="jsdelivr.net"></script>
    
    <!-- Visual Layout Styles: Inspired by the dark, minimalist design system of Nothing OS -->
    <style>
        /* Base setup to ensure layout sizing reads cleanly on mobile phone touchscreens */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0b0b0b; color: #f5f5f5; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; overflow-x: hidden; }
        
        /* Application Display Card Containers (Views) */
        .screen { width: 100%; max-width: 400px; background-color: #161616; border: 1px solid #262626; border-radius: 24px; padding: 28px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); display: none; }
        .screen.active { display: block; }
        
        /* Typography Elements */
        h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; text-align: center; margin-bottom: 24px; color: #ffffff; }
        h1 span { color: #ef4444; }
        h2 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
        .subtitle { font-size: 12px; color: #a3a3a3; font-family: monospace; text-transform: uppercase; margin-bottom: 16px; }
        .section-title { font-size: 11px; font-weight: 600; color: #a3a3a3; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; display: block; }
        
        /* Input Field Consoles */
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 11px; font-weight: 600; color: #a3a3a3; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        input { width: 100%; background-color: #222; border: 1px solid #333; border-radius: 12px; padding: 14px; color: #ffffff; font-size: 16px; }
        input:focus { outline: none; border-color: #ef4444; }
        input.uppercase { text-transform: uppercase; font-family: monospace; letter-spacing: 2px; }
        
        /* Active Game Discovery Room Deck Container */
        .room-deck { background-color: #1c1c1c; border: 1px dashed #333; border-radius: 14px; padding: 12px; margin-bottom: 20px; max-height: 110px; overflow-y: auto; }
        .deck-title { font-size: 10px; font-weight: 700; color: #737373; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; display: block; }
        .rooms-wrapper { display: flex; flex-wrap: wrap; gap: 6px; }
        
        /* Interactive clickable card badges for available game codes */
        .room-card { background-color: #262626; border: 1px solid #404040; border-radius: 8px; padding: 6px 12px; font-size: 12px; font-family: monospace; font-weight: 700; color: #ffffff; cursor: pointer; }
        .no-rooms { font-size: 11px; color: #525252; font-style: italic; }
        
        /* Action Buttons Core Styles */
        .btn { display: block; width: 100%; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 700; border: none; cursor: pointer; text-align: center; margin-bottom: 12px; }
        .btn-primary { background-color: #ffffff; color: #000000; }
        .btn-secondary { background-color: #222222; color: #d4d4d4; border: 1px solid #333333; }
        .btn-danger { background-color: #ef4444; color: #ffffff; }
        
        /* Header Player Meta Badges */
        .meta-container { display: flex; gap: 12px; justify-content: center; margin-bottom: 24px; }
        .badge { background-color: #222; border: 1px solid #333; padding: 6px 14px; border-radius: 20px; font-family: monospace; font-size: 12px; color: #a3a3a3; }
        
        /* Mechanical 3D Response Buzzer Setup */
        .buzzer-wrapper { display: flex; justify-content: center; align-items: center; height: 280px; }
        .buzzer-btn { width: 200px; height: 200px; border-radius: 50%; font-size: 22px; font-weight: 800; text-transform: uppercase; border: none; color: #ffffff; cursor: pointer; outline: none; transition: all 0.1s; }
        
        /* Mechanical Red Button State */
        .buzzer-red { background-color: #dc2626; border-bottom: 12px solid #991b1b; box-shadow: 0 12px 0 #991b1b, 0 20px 30px rgba(0,0,0,0.5); }
        .buzzer-red:active { transform: translateY(8px); border-bottom: 4px solid #991b1b; box-shadow: 0 4px 0 #991b1b, 0 10px 15px rgba(0,0,0,0.3); }
        
        /* Lockout Green Pressed State */
        .buzzer-green { background-color: #059669; border-bottom: 12px solid #047857; box-shadow: 0 12px 0 #047857, 0 20px 30px rgba(0,0,0,0.4); pointer-events: none; }
        
        /* Real-time Leaderboard Entry list row fields */
        .leaderboard-list { max-height: 260px; overflow-y: auto; }
        .row-entry { display: flex; justify-content: space-between; align-items: center; padding: 14px; background-color: #1e1e1e; border: 1px solid #2d2d2d; border-radius: 12px; margin-bottom: 8px; }
        .row-entry.winner { background-color: rgba(5, 150, 105, 0.15); border-color: #059669; color: #34d399; font-weight: bold; }
        .row-left { display: flex; align-items: center; gap: 10px; }
        .rank { font-family: monospace; font-size: 12px; color: #737373; }
        .timestamp { font-family: monospace; font-size: 11px; color: #737373; }
        .fastest-tag { background-color: #059669; color: #000000; font-size: 9px; font-weight: 900; padding: 2px 6px; border-radius: 4px; letter-spacing: 1px; margin-right: 6px; }
        .empty-text { text-align: center; color: #525252; font-style: italic; padding: 24px 0; font-size: 14px; }
    </style>
</head>
<body>

    <!-- SCREEN 1: LANDING CONSOLE VIEW -->
    <div id="screen-landing" class="screen active">
        <h1>QUIZ<span>BUZZER</span></h1>
        
        <!-- Live Discovery Deck: Displays rooms that currently exist in the database -->
        <div class="room-deck">
            <span class="deck-title">Active Game Rooms (Tap to Select)</span>
            <div id="live-rooms-wrapper" class="rooms-wrapper">
                <span class="no-rooms">Connecting to network...</span>
            </div>
        </div>

        <div class="form-group">
            <label>Room Code</label>
            <input type="text" id="room-input" placeholder="E.G. GAME123" class="uppercase">
        </div>
        <div class="form-group">
            <label>Your Name</label>
            <input type="text" id="username-input" placeholder="E.g. Alex">
        </div>
        <button onclick="navigateGame(false)" class="btn btn-primary">Join as Player</button>
        <button onclick="navigateGame(true)" class="btn btn-secondary">Host as Admin</button>
    </div>

    <!-- SCREEN 2: PLAYER BUZZER INTERFACE VIEW -->
    <div id="screen-player" class="screen">
        <div class="meta-container">
            <div class="badge">ROOM: <strong id="p-room">-</strong></div>
            <div class="badge">USER: <strong id="p-name">-</strong></div>
        </div>
        <div class="buzzer-wrapper">
            <button id="buzzer-btn" onclick="sendBuzzHit()" class="buzzer-btn buzzer-red">Press to Buzz</button>
        </div>
    </div>

    <!-- SCREEN 3: HOST ADMIN FEEDBACK CONTROL VIEW -->
    <div id="screen-admin" class="screen" style="max-width: 500px;">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; border-bottom: 1px solid #262626; padding-bottom: 16px;">
            <div>
                <h2>Admin Dashboard</h2>
                <div class="subtitle">Room: <span id="a-room" style="color:#ef4444; font-weight:bold;">-</span></div>
            </div>
            <button onclick="clearBoard()" class="btn btn-primary" style="width: auto; padding: 10px 18px; margin: 0; font-size: 13px;">Reset Board</button>
        </div>
        
        <span class="section-title">Buzzer Feed Order</span>
        <div id="leaderboard" class="leaderboard-list">
            <div class="empty-text">Waiting for players to buzz...</div>
        </div>
        <button onclick="deleteEntireRoom()" class="btn btn-danger" style="font-size:14px; padding:12px; margin-top:20px;">Close & Delete Room</button>
    </div>

    <!-- CLIENT LOGIC ENGINE -->
    <script>
        // Production configuration settings linked directly to your Supabase project cluster
        const DB_URL = "supabase.co";
        const DB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndmcHFteWZoYndxc3pkemZqdmJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3MjgwNjEsImV4cCI6MjA5NDMwNDA2MX0.bm1xlejZwhtvGL-CzdozL9yaw3iksaTbe8l1re2vrCg";
        
        let client = null;
        let activeRoom = "";
        let playerIdentity = "";
        let canBuzz = true;

        /**
         * Defensive Initializer Framework:
         * Checks if the external Supabase file has finished installing in browser memory.
         * If yes, it spawns the client wrapper. Returns true on success.
         */
        function safeConnectDatabase() {
            if (client) return true; // If already connected, skip setup
            try {
                if (window.supabase && window.supabase.createClient) {
                    client = window.supabase.createClient(DB_URL, DB_KEY);
                    return true;
                }
            } catch(err) {
                console.error("Database connection fault: ", err);
            }
            return false;
        }

        /**
         * Safe Boot Loop Listener:
         * Runs automatically at page load. Instead of executing code aggressively, it checks 
         * every 300 milliseconds to see if the library file is ready. Once ready, it unlocks 
         * the panel and starts scanning the database table rows for existing games.
         */
        window.addEventListener('DOMContentLoaded', () => {
            let loopCounter = 0;
            const checkLibraryStatus = setInterval(() => {
                loopCounter++;
                
                if (safeConnectDatabase()) {
                    // Success Path: Library found, shut down loop and fetch rooms
                    clearInterval(checkLibraryStatus);
                    fetchActiveRoomsDiscovery();
                    
                    // Open a real-time live channel to update card badges instantly if rooms change
                    client.channel('discovery-tracker')
                        .on('postgres_changes', { event: '*', schema: 'public', table: 'rooms' }, () => {
                            fetchActiveRoomsDiscovery();
                        })
                        .subscribe();
                } else if (loopCounter > 20) {
                    // Timeout Path: Library failed to load after 6 seconds
                    clearInterval(checkLibraryStatus);
                    document.getElementById('live-rooms-wrapper').innerHTML = '<span class="no-rooms">Connection timeout. Refresh page.</span>';
                }
            }, 300);
        });

        /**
         * Discovery Scanner:
         * Queries your Supabase 'rooms' table and loops through existing codes to print
         * clickable text badges on the landing view.
         */
        async function fetchActiveRoomsDiscovery() {
            if(!client) return;
            try {
                const { data, error } = await client.from('rooms').select('id');
                const container = document.getElementById('live-rooms-wrapper');
                if(!container) return;

                if(error || !data || data.length === 0) {
                    container.innerHTML = '<span class="no-rooms">No active rooms found...</span>';
                    return;
                }

                container.innerHTML = ""; // Wipe "Connecting..." label
                data.forEach(room => {
                    const badge = document.createElement('span');
                    badge.className = 'room-card';
                    badge.innerText = room.id;
                    // Clicking a room badge automatically types it into the code input box
                    badge.onclick = () => {
                        document.getElementById('room-input').value = room.id;
                    };
                    container.appendChild(badge);
                });
            } catch(e) {
                console.log("Discovery processing exception intercepted.");
            }
        }

        /**
         * Navigation Router:
         * Handles routing switches between landing cards, player buzzers, and admin panels.
         */
        async function navigateGame(isAdminRole) {
            // Safety Gate check: If database is down, reject tap and print message banner
            if(!safeConnectDatabase()) {
                return alert("Connection loading. Tap once more.");
            }

            const roomVal = document.getElementById('room-input').value.trim().toUpperCase();
            const userVal = document.getElementById('username-input').value.trim();

            if (!roomVal) return alert("Enter a Room Code");
            if (!isAdminRole && !userVal) return alert("Enter your Name");

            activeRoom = roomVal;
            playerIdentity = isAdminRole ? "Admin" : userVal;

            if (isAdminRole) {
                // Host Action Path: Create or update room token string in database
                await client.from('rooms').upsert({ id: activeRoom });
                document.getElementById('a-room').innerText = activeRoom;
                document.getElementById('screen-landing').style.display = 'none';
                document.getElementById('screen-admin').style.display = 'block';
                connectStreams();
                renderLeaderboard();
            } else {
                // Player Action Path: Explicit row-check confirmation match validation
                const { data, error } = await client.from('rooms').select('id').eq('id', activeRoom).maybeSingle();
                
                if (error || !data) {
                    return alert("This room does not exist yet. Please wait for the host to create it.");
                }

                document.getElementById('p-room').innerText = activeRoom;
                document.getElementById('p-name').innerText = playerIdentity;
                document.getElementById('screen-landing').style.display = 'none';
                document.getElementById('screen-player').style.display = 'block';
                connectStreams();
            }
        }

        /**
         * Real-time Synchronization Streams:
         * Mounts WebSocket channels to coordinate real-time delivery payloads across viewports.
         */
        function connectStreams() {
            // Feed Channel: Monitors the 'buzzes' database table for real-time insert/delete mutations
            client.channel(`buzzes:${activeRoom}`)
                .on('postgres_changes', { event: '*', schema: 'public', table: 'buzzes', filter: `room_id=eq.${activeRoom}` }, (payload) => {
                    if (playerIdentity === "Admin") {
                        renderLeaderboard(); // Re-render feed instantly if Admin
                    } else {
                        evaluateGlobalSync(payload); // Recalculate physical button coloring states if Player
                    }
                })
                .subscribe();

            // Teardown Channel: Monitors the 'rooms' table for host eviction actions
            client.channel(`rooms:${activeRoom}`)
                .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'rooms', filter: `id=eq.${activeRoom}` }, () => {
                    if (playerIdentity !== "Admin") {
                        alert("The Host has ended this session.");
                        location.reload(); // Hard dump local states and return player to landing panel safely
                    }
                })
                .subscribe();
        }

        /**
         * Transmission Pipeline:
         * Logs player buzz interactions down into your Supabase database table instance.
         */
        async function sendBuzzHit() {
            if (!canBuzz) return;
            canBuzz = false; // Prevent double hitting locally

            if (navigator.vibrate) navigator.vibrate(100); // Mobile engine physical kick

            await client.from('buzzes').insert({
                room_id: activeRoom,
                username: playerIdentity
            });
        }

        /**
         * Universal Button Reset Interceptor:
         * Coordinates player buttons based on incoming database instructions.
         */
        function evaluateGlobalSync(payload) {
            const btn = document.getElementById('buzzer-btn');
            if (!btn) return;

            // Intercept flushes: If admin fires a DELETE row clear payload, unlock and return button to red
            if (payload.eventType === 'DELETE' || !payload.new || Object.keys(payload.new).length === 0) {
                canBuzz = true;
                btn.className = "buzzer-btn buzzer-red";
                btn.innerText = "Press to Buzz";
                return;
            } 
            
            // Intercept hits: If an INSERT log happens, latch button state to green lockout phase
            if (payload.eventType === 'INSERT') {
                canBuzz = false;
                const winnerName = payload.new.username;
                btn.className = "buzzer-btn buzzer-green";
                btn.innerText = `${winnerName} BUZZED!`;
            }
        }

        /**
         * Millisecond Rendering Pipeline (Admin Dashboard View):
         * Sorts player logs dynamically and displays structural ranking placements.
         */
        async function renderLeaderboard() {
            const { data, error } = await client
                .from('buzzes')
                .select('username, buzzed_at')
                .eq('room_id', activeRoom)
                .order('buzzed_at', { ascending: true }); // Arrange sequential rankings cleanly down to the millisecond

            if (error) return;
            const container = document.getElementById('leaderboard');
            if(!container) return;

            if (data.length === 0) {
                container.innerHTML = '<div class="empty-text">Waiting for players to buzz...</div>';
                return;
            }

            container.innerHTML = ""; // Remove placeholder text
            data.forEach((entry, idx) => {
                const item = document.createElement('div');
                const isFirst = idx === 0;
                
                item.className = `row-entry ${isFirst ? 'winner' : ''}`;
                item.innerHTML = `
                    <div class="row-left">
                        <span class="rank">#${idx + 1}</span>
                        <span>${entry.username}</span>
                    </div>
                    <div style="display:flex; align-items:center;">
                        ${isFirst ? '<span class="fastest-tag">FASTEST</span>' : ''}
                        <span class="timestamp">${new Date(entry.buzzed_at).toLocaleTimeString()}</span>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        /**
         * Admin Action: Board Wipe
         * Wipes room rows out of 'buzzes' table, automatically triggering player resets via the sync stream.
         */
        async function clearBoard() {
            await client.from('buzzes').delete().eq('room_id', activeRoom);
            renderLeaderboard();
        }

        /**
         * Admin Action: Session Teardown
         * Destroys the room ro
