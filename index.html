<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiz Buzzer</title>
    
    <!-- Self-Contained Native Scripting Layout Core. No external script downloads required. -->
    <style>
        /* Global touch optimizations to ensure layout parameters read perfectly on Android touchscreens */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0b0b0b; color: #f5f5f5; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; overflow-x: hidden; position: relative; }
        
        /* Application Display Viewports */
        .screen { width: 100%; max-width: 400px; background-color: #161616; border: 1px solid #262626; border-radius: 24px; padding: 28px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); display: none; }
        .screen.active { display: block; }
        
        /* Typography Elements Layout */
        h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; text-align: center; margin-bottom: 24px; color: #ffffff; }
        h1 span { color: #ef4444; }
        h2 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
        .subtitle { font-size: 12px; color: #a3a3a3; font-family: monospace; text-transform: uppercase; margin-bottom: 16px; }
        .section-title { font-size: 11px; font-weight: 600; color: #a3a3a3; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; display: block; }
        
        /* Entry Input Fields */
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 11px; font-weight: 600; color: #a3a3a3; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        input { width: 100%; background-color: #222; border: 1px solid #333; border-radius: 12px; padding: 14px; color: #ffffff; font-size: 16px; }
        input:focus { outline: none; border-color: #ef4444; }
        input.uppercase { text-transform: uppercase; font-family: monospace; letter-spacing: 2px; }
        
        /* Room Discovery Deck Components */
        .room-deck { background-color: #1c1c1c; border: 1px dashed #333; border-radius: 14px; padding: 14px; margin-bottom: 24px; }
        .deck-title { font-size: 10px; font-weight: 700; color: #737373; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; display: block; }
        .rooms-wrapper { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
        
        /* Autofill touch selection card badges */
        .room-card { background-color: #262626; border: 1px solid #404040; border-radius: 8px; padding: 8px 14px; font-size: 12px; font-family: monospace; font-weight: 700; color: #ffffff; cursor: pointer; }
        .room-card:active { background-color: #059669; }
        .status-msg { font-size: 11px; color: #737373; font-style: italic; }
        
        /* Utility Action Buttons Framework */
        .btn { display: block; width: 100%; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 700; border: none; cursor: pointer; text-align: center; margin-bottom: 12px; transition: transform 0.1s; }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background-color: #ffffff; color: #000000; }
        .btn-secondary { background-color: #222222; color: #d4d4d4; border: 1px solid #333333; }
        .btn-danger { background-color: #ef4444; color: #ffffff; margin-bottom: 6px; }
        .btn-small { padding: 8px 12px; font-size: 11px; width: auto; display: inline-block; margin-bottom: 0; background-color: #262626; color: #a3a3a3; border: 1px solid #333; }
        
        /* Live Header Room Tracking Badges */
        .meta-container { display: flex; gap: 12px; justify-content: center; margin-bottom: 24px; }
        .badge { background-color: #222; border: 1px solid #333; padding: 6px 14px; border-radius: 20px; font-family: monospace; font-size: 12px; color: #a3a3a3; }
        
        /* Mechanical 3D Response Buzzer Component */
        .buzzer-wrapper { display: flex; justify-content: center; align-items: center; height: 280px; }
        .buzzer-btn { width: 200px; height: 200px; border-radius: 50%; font-size: 22px; font-weight: 800; text-transform: uppercase; border: none; color: #ffffff; cursor: pointer; outline: none; transition: all 0.1s; }
        
        .buzzer-red { background-color: #dc2626; border-bottom: 12px solid #991b1b; box-shadow: 0 12px 0 #991b1b, 0 20px 30px rgba(0,0,0,0.5); }
        .buzzer-red:active { transform: translateY(8px); border-bottom: 4px solid #991b1b; box-shadow: 0 4px 0 #991b1b, 0 10px 15px rgba(0,0,0,0.3); }
        
        .buzzer-green { background-color: #059669; border-bottom: 12px solid #047857; box-shadow: 0 12px 0 #047857, 0 20px 30px rgba(0,0,0,0.4); pointer-events: none; }
        
        /* Leaderboard Entries list feeds */
        .leaderboard-list { max-height: 260px; overflow-y: auto; }
        .row-entry { display: flex; justify-content: space-between; align-items: center; padding: 14px; background-color: #1e1e1e; border: 1px solid #2d2d2d; border-radius: 12px; margin-bottom: 8px; }
        .row-entry.winner { background-color: rgba(5, 150, 105, 0.15); border-color: #059669; color: #34d399; font-weight: bold; }
        .row-left { display: flex; align-items: center; gap: 10px; }
        .rank { font-family: monospace; font-size: 12px; color: #737373; }
        .timestamp { font-family: monospace; font-size: 11px; color: #737373; }
        .fastest-tag { background-color: #059669; color: #000000; font-size: 9px; font-weight: 900; padding: 2px 6px; border-radius: 4px; letter-spacing: 1px; margin-right: 6px; }
        .empty-text { text-align: center; color: #525252; font-style: italic; padding: 24px 0; font-size: 14px; }

        /* Dynamic Versioning Label Stamp Alignment */
        .version-stamp { position: absolute; bottom: 8px; right: 12px; font-family: monospace; font-size: 10px; color: #404040; letter-spacing: 0.5px; pointer-events: none; text-align: right; }
    </style>
</head>
<body>

    <!-- SCREEN 1: LANDING CONSOLE VIEW -->
    <div id="screen-landing" class="screen active">
        <h1>QUIZ<span>BUZZER</span></h1>
        
        <!-- Manual Room Discovery Sub-Module Container -->
        <div class="room-deck">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <span class="deck-title" style="margin-bottom:0;">Room Discovery Panel</span>
                <button onclick="manuallyScanActiveRooms()" class="btn btn-small">Scan for Active Rooms</button>
            </div>
            <div id="live-rooms-wrapper" class="rooms-wrapper">
                <span class="status-msg">Tap Scan to check for live game rooms.</span>
            </div>
        </div>

        <div class="form-group">
            <label>Room Code</label>
            <input type="text" id="room-input" placeholder="E.G. GAME123" class="uppercase">
        </div>
        <div class="form-group">
            <label>Your Name</label>
            <input type="text" id="username-input" placeholder="E.g. Alex">
        </div>
        <button onclick="navigateGame(false)" class="btn btn-primary">Join as Player</button>
        <button onclick="navigateGame(true)" class="btn btn-secondary">Host as Admin</button>
    </div>

    <!-- SCREEN 2: PLAYER INTERACTIVE BUZZER VIEW -->
    <div id="screen-player" class="screen">
        <div class="meta-container">
            <div class="badge">ROOM: <strong id="p-room">-</strong></div>
            <div class="badge">USER: <strong id="p-name">-</strong></div>
        </div>
        <div class="buzzer-wrapper">
            <button id="buzzer-btn" onclick="sendBuzzHit()" class="buzzer-btn buzzer-red">Press to Buzz</button>
        </div>
    </div>

    <!-- SCREEN 3: HOST CONTROL DASHBOARD VIEW -->
    <div id="screen-admin" class="screen" style="max-width: 500px;">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; border-bottom: 1px solid #262626; padding-bottom: 16px;">
            <div>
                <h2>Admin Dashboard</h2>
                <div class="subtitle">Room: <span id="a-room" style="color:#ef4444; font-weight:bold;">-</span></div>
            </div>
            <button onclick="clearBoard()" class="btn btn-primary" style="width: auto; padding: 10px 18px; margin: 0; font-size: 13px;">Reset Board</button>
        </div>
        
        <span class="section-title">Buzzer Feed Order</span>
        <div id="leaderboard" class="leaderboard-list">
            <div class="empty-text">Waiting for players to buzz...</div>
        </div>
        <button onclick="deleteEntireRoom()" class="btn btn-danger" style="font-size:14px; padding:12px; margin-top:20px;">Close & Delete Room</button>
    </div>

    <!-- ADDED FEATURE: Global Version Badge Component Footprint Alignment -->
    <div class="version-stamp">Ver.1.1.0.14.05.2026.15.42.00</div>

    <!-- SYSTEM WEB SERVICE CHANNELS -->
    <script>
        /* FIXED DOMAIN ROUTING ENDPOINT: Embedded the exact unique sub-domain tracking parameter with /rest/v1 base URL */
        const API_BASE = "supabase.co";
        
        const HEADERS = {
            "apikey": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndmcHFteWZoYndxc3pkemZqdmJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3MjgwNjEsImV4cCI6MjA5NDMwNDA2MX0.bm1xlejZwhtvGL-CzdozL9yaw3iksaTbe8l1re2vrCg",
            "Authorization": "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndmcHFteWZoYndxc3pkemZqdmJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3MjgwNjEsImV4cCI6MjA5NDMwNDA2MX0.bm1xlejZwhtvGL-CzdozL9yaw3iksaTbe8l1re2vrCg",
            "Content-Type": "application/json",
            "Prefer": "return=representation"
        };
        
        let activeRoom = "";
        let playerIdentity = "";
        let canBuzz = true;
        let activePollingInterval = null;

        /**
         * Manual Discovery Scanner Engine:
         * Intercepts table data directly over clean HTTPS fetch requests.
         */
        async function manuallyScanActiveRooms() {
            const container = document.getElementById('live-rooms-wrapper');
            if(!container) return;

            container.innerHTML = '<span class="status-msg">Reading active rooms...</span>';

            try {
                const response = await fetch(`${API_BASE}/rooms?select=id`, { method: "GET", headers: HEADERS });
                
                if(!response.ok) {
                    throw new Error(`HTTP Error Status Code: ${response.status}`);
                }
                
                const data = await response.json();
                
                if(!data || data.length === 0) {
                    container.innerHTML = '<span class="status-msg" style="color:#ef4444;">No room has been created yet.</span>';
                    return;
                }

                container.innerHTML = ""; 
                
                data.forEach(room => {
                    const badge = document.createElement('span');
                    badge.className = 'room-card';
                    badge.innerText = `${room.id} [Load]`;
                    
                    badge.onclick = () => {
                        const inputField = document.getElementById('room-input');
                        if(inputField) {
                            inputField.value = room.id;
                            if (navigator.vibrate) navigator.vibrate(50); 
                        }
                    };
                    container.appendChild(badge);
                });
            } catch(e) {
                alert("Room Scan Action Failed! Error Detail: " + e.message);
                container.innerHTML = '<span class="status-msg" style="color:#ef4444;">Scan pipeline offline.</span>';
            }
        }

        /**
         * Navigation Interface Router:
         * Transitions views locally immediately, then writes rows to the background thread seamlessly.
         */
        async function navigateGame(isAdminRole) {
            const roomVal = document.getElementById('room-input').value.trim().toUpperCase();
            const userVal = document.getElementById('username-input').value.trim();

            if (!roomVal) return alert("Enter a Room Code");
            if (!isAdminRole && !userVal) return alert("Enter your Name");

            activeRoom = roomVal;
            playerIdentity = isAdminRole ? "Admin" : userVal;

            if (isAdminRole) {
                /* SUCCESS PATH: Shift UI views locally first to keep application highly responsive */
                document.getElementById('screen-landing').style.display = 'none';
                document.getElementById('a-room').innerText = activeRoom;
                document.getElementById('screen-admin').style.display = 'block';
                
                try {
                    const response = await fetch(`${API_BASE}/rooms`, {
                        method: "POST",
                        headers: HEADERS,
                        body: JSON.stringify({ id: activeRoom })
                    });
                    
                    if(!response.ok) throw new Error(`HTTP Status Code: ${response.status}`);

                    renderLeaderboard();
                    activePollingInterval = setInterval(renderLeaderboard, 1500);
                } catch(err) {
                    alert("Admin Cloud Registry Error: " + err.message);
                }
            } else {
                try {
                    const response = await fetch(`${API_BASE}/rooms?id=eq.${activeRoom}&select=id`, { method: "GET", headers: HEADERS });
                    
                    if(!response.ok) throw new Error(`HTTP Status Code: ${response.status}`);
                    
                    const roomsList = await response.json();

                    if (!roomsList || roomsList.length === 0) {
                        return alert("This room does not exist yet. Please wait for the host to create it.");
                    }

                    /* SUCCESS PATH: Shift UI view instantly to display the red quiz buzzer */
                    document.getElementById('screen-landing').style.display = 'none';
                    document.getElementById('p-room').innerText = activeRoom;
                    document.getElementById('p-name').innerText = playerIdentity;
                    document.getElementById('screen-player').style.display = 'block';
                    
                    activePollingInterval = setInterval(checkPlayerGlobalStateSync, 1500);
                } catch(err) {
                    alert("Guest Join Validation Failure! Detail: " + err.message);
                }
            }
        }

        /**
         * Transmission Pipeline: Logs buzzer hits down into database table rows.
         */
        async function sendBuzzHit() {
            if (!canBuzz) return;
            canBuzz = false; 

            if (navigator.vibrate) navigator.vibrate(100); 

            try {
                const btn = document.getElementById('buzzer-btn');
                if(btn) {
                    btn.className = "buzzer-btn buzzer-green";
                    btn.innerText = `${playerIdentity} BUZZED!`;
                }

                const response = await fetch(`${API_BASE}/buzzes`, {
                    method: "POST",
                    headers: HEADERS,
                    body: JSON.stringify({ room_id: activeRoom, username: playerIdentity })
                });
                
                if(!response.ok) throw new Error(`HTTP Status Code: ${response.status}`);
            } catch(e) {
                canBuzz = true;
                alert("Buzzer Signal Sync Drop! Detail: " + e.message);
            }
        }

        /**
         * Player Synchronization Loop Engine:
         * Regularly polls table layers to sync display states with admin commands.
         */
        async function checkPlayerGlobalStateSync() {
            try {
                const roomCheck = await fetch(`${API_BASE}/rooms?id=eq.${activeRoom}&select=id`, { method: "GET", headers: HEADERS });
                const roomData = await roomCheck.json();
                
                if (!roomData || roomData.length === 0) {
                    clearInterval(activePollingInterval);
                    alert("The Host has closed this gaming room session.");
                    location.reload(); 
                    return;
                }

                const buzzCheck = await fetch(`${API_BASE}/buzzes?room_id=eq.${activeRoom}&select=username&order=buzzed_at.asc`, { method: "GET", headers: HEADERS });
                const buzzData = await buzzCheck.json();
                const btn = document.getElementById('buzzer-btn');
                if(!btn) return;

                if (!buzzData || buzzData.length === 0) {
                    canBuzz = true;
                    btn.className = "buzzer-btn buzzer-red";
                    btn.innerText = "Press to Buzz";
                } else {
                    canBuzz = false;
                    const activeWinner = buzzData[0].username; // Zero indexing layout selection maps winner string parameter correctly
                    btn.className = "buzzer-btn buzzer-green";
                    btn.innerText = `${activeWinner} BUZZED!`;
                }
            } catch(e) {
                console.log("Sync tracking tick cycle pending...");
            }
        }

        /**
         * Admin Leaderboard Sync Renderer:
         * Organizes user logs sequentially based on millisecond entry times.
         */
        async function renderLeaderboard() {
            try {
                const response = await fetch(`${API_BASE}/buzzes?room_id=eq.${activeRoom}&select=username,buzzed_at&order=buzzed_at.asc`, { method: "GET", headers: HEADERS });
                const data = await response.json();
                const container = document.getElementById('leaderboard');
                if(!container || !data) return;

                if (data.length === 0) {
                    container.innerHTML = '<div class="empty-text">Waiting for players to buzz...</div>';
                    return;
                }

                container.innerHTML = ""; 
                data.forEach((entry, idx) => {
                    const item = document.createElement('div');
                    const isFirst = idx === 0;
                    
                    item.className = `row-entry ${isFirst ? 'winner' : ''}`;
                    item.innerHTML = `
                        <div class="row-left">
                            <span class="rank">#${idx + 1}</span>
                            <span>${entry.username}</span>
                        </div>
                        <div style="display:flex; align-items:center;">
                            ${isFirst ? '<span class="fastest-tag">FASTEST</span>' : ''}
                            <span class="timestamp">${new Date(entry.buzzed_at).toLocaleTimeString()}</span>
                        </div>
                    `;
                    container.appendChild(item);
                });
            } catch(e) {
                console.log("Leaderboard parsing loop waiting...");
            }
        }

        /**
         * Reset Utility.
         */
        async function clearBoard() {
            try {
                await fetch(`${API_BASE}/buzzes?room_id=eq.${activeRoom}`, { method: "DELETE", headers: HEADERS });
                renderLeaderboard();
            } catch(e) {
                alert("Board Wipe Failed: " + e.message);
            }
